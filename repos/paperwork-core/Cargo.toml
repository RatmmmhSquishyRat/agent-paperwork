[package]
name = "paperwork-core"
version = "0.6.0"
edition = "2021"
description = "Core library for Agent Paperwork — stateless, file-based collaboration primitives for AI agents"
license = "MIT"
repository = "https://github.com/RatmmmhSquishyRat/agent-paperwork"
homepage = "https://github.com/RatmmmhSquishyRat/agent-paperwork"
readme = "README.md"
keywords = ["agent", "collaboration", "file-based", "cli", "markdown"]
categories = ["command-line-utilities", "text-processing"]
rust-version = "1.89"

[dependencies]
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
