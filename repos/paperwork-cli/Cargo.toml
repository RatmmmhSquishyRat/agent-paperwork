[package]
name = "paperwork-cli"
version = "0.2.0"
edition = "2021"
description = "Stateless, file-based collaboration CLI for AI agents — everything is a file, append-only, human-readable"
license = "MIT"
repository = "https://github.com/RatmmmhSquishyRat/agent-paperwork"
homepage = "https://github.com/RatmmmhSquishyRat/agent-paperwork"
readme = "README.md"
keywords = ["agent", "collaboration", "file-based", "cli", "markdown"]
categories = ["command-line-utilities"]
rust-version = "1.89"

[[bin]]
name = "paperwork"
path = "src/main.rs"

[dependencies]
paperwork-core = { version = "0.2", path = "../paperwork-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
