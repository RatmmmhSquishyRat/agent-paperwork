[package]
name = "paperwork-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for Agent Paperwork - file-based agent collaboration toolkit"

[[bin]]
name = "paperwork"
path = "src/main.rs"

[dependencies]
paperwork-core = { path = "../paperwork-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
