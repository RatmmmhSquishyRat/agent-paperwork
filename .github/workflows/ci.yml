name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p paperwork-cli

      - name: Smoke test (unix)
        if: runner.os != 'Windows'
        run: |
          BIN=$(pwd)/target/release/paperwork
          cd $(mktemp -d)

          # Profile
          $BIN profile create alice alice --model gpt-4o | grep "^ok profile.create"
          $BIN profile show alice | grep "^ok profile.show"
          $BIN profile list . | grep "^ok profile.list"

          # Post
          $BIN post create standup "Test" --participants alice,bob | grep "^ok post.create"
          $BIN post send standup alice "Hello world" | grep "^ok post.send"
          $BIN post send standup bob --reply-to 2 "Reply" | grep "^ok post.send"
          $BIN post read standup | grep "^ok post.read"
          $BIN post read standup --json | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok'"
          $BIN post summary standup | grep "^ok post.summary"

          # Stdin
          echo "piped content" | $BIN post send standup alice --stdin | grep "^ok post.send"

          # Brief
          echo "fn main() {}" > main.rs
          $BIN brief create guide "Guide" --owner alice | grep "^ok brief.create"
          $BIN brief add guide main.rs --regex "fn main" | grep "^ok brief.add"
          $BIN brief verify guide | grep "^ok brief.verify"
          $BIN brief read guide --full | grep "regex:"

          # Contacts
          $BIN contacts create team --title "Team" | grep "^ok contacts.create"
          $BIN contacts add team ./alice.profile.md | grep "^ok contacts.add"
          $BIN contacts read team | grep "alice"

          # Validate
          $BIN validate standup.post.md | grep "^ok validate"

          # Error handling
          if $BIN post read nonexistent 2>&1 | grep -q "^error not-found:"; then
            echo "PASS: error envelope"
          else
            echo "FAIL: error envelope"; exit 1
          fi

          # Empty body rejection
          if $BIN post send standup alice "" 2>&1 | grep -q "^error validation:"; then
            echo "PASS: empty body rejection"
          else
            echo "FAIL: empty body rejection"; exit 1
          fi

          # Validate garbage rejection
          echo "garbage" > bad.post.md
          if $BIN validate bad.post.md 2>&1 | grep -q "^error"; then
            echo "PASS: validate rejects garbage"
          else
            echo "FAIL: validate rejects garbage"; exit 1
          fi

          # Usage envelope (exit 2): old-grammar flag must yield category usage
          set +e
          $BIN post send x.post.md --from alice "hi" 2>usage_err.txt
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then echo "FAIL: expected exit 2, got $code"; exit 1; fi
          if grep -q "^error usage:" usage_err.txt; then
            echo "PASS: usage envelope exit 2"
          else
            echo "FAIL: usage envelope"; exit 1
          fi

          echo "=== ALL SMOKE TESTS PASSED ==="

      - name: Smoke test (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $BIN = Join-Path (Get-Location) "target\release\paperwork.exe"
          $tmp = New-Item -ItemType Directory -Path (Join-Path $env:TEMP "pw-smoke-$(Get-Random)") -Force
          Push-Location $tmp

          # Profile
          & $BIN profile create alice alice --model gpt-4o | Select-String "^ok profile.create"
          & $BIN profile show alice | Select-String "^ok profile.show"

          # Post
          & $BIN post create standup "Test" --participants alice,bob | Select-String "^ok post.create"
          & $BIN post send standup alice "Hello world" | Select-String "^ok post.send"
          & $BIN post send standup bob --reply-to 2 "Reply" | Select-String "^ok post.send"
          & $BIN post read standup | Select-String "^ok post.read"
          & $BIN post summary standup | Select-String "^ok post.summary"

          # --json status assertion (Daniel #5)
          $json = & $BIN post read standup --json | Out-String
          if ($json -match '"status":"ok"') { Write-Output "PASS: json status" }
          else { Write-Error "FAIL: json status"; exit 1 }

          # Stdin
          "piped content" | & $BIN post send standup alice --stdin | Select-String "^ok post.send"

          # Brief
          Set-Content "main.rs" -Value "fn main() {}"
          & $BIN brief create guide "Guide" --owner alice | Select-String "^ok brief.create"
          & $BIN brief add guide main.rs --regex "fn main" | Select-String "^ok brief.add"
          & $BIN brief verify guide | Select-String "^ok brief.verify"

          # Contacts
          & $BIN contacts create team --title "Team" | Select-String "^ok contacts.create"
          & $BIN contacts add team ./alice.profile.md | Select-String "^ok contacts.add"
          & $BIN contacts read team | Select-String "alice"

          # Validate
          & $BIN validate standup.post.md | Select-String "^ok validate"

          # Error handling
          $err = & $BIN post read nonexistent 2>&1 | Out-String
          if ($err -match "^error not-found:") { Write-Output "PASS: error envelope" }
          else { Write-Error "FAIL: error envelope"; exit 1 }

          # Empty body rejection
          $err = & $BIN post send standup alice "" 2>&1 | Out-String
          if ($err -match "^error validation:") { Write-Output "PASS: empty body" }
          else { Write-Error "FAIL: empty body"; exit 1 }

          # Validate garbage
          Set-Content "bad.post.md" -Value "garbage"
          $err = & $BIN validate bad.post.md 2>&1 | Out-String
          if ($err -match "^error") { Write-Output "PASS: validate garbage" }
          else { Write-Error "FAIL: validate garbage"; exit 1 }

          # Usage envelope (exit 2): old-grammar flag must yield category usage
          $err = & $BIN post send x.post.md --from alice "hi" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2) { Write-Error "FAIL: expected exit 2, got $LASTEXITCODE"; exit 1 }
          if ($err -match "^error usage:") { Write-Output "PASS: usage envelope exit 2" }
          else { Write-Error "FAIL: usage envelope"; exit 1 }

          Pop-Location
          Write-Output "=== ALL SMOKE TESTS PASSED ==="
          exit 0
